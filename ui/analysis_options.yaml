include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    # Freezed/json_serializable annotations on factory constructors.
    invalid_annotation_target: ignore

linter:
  rules:
    # This is an application, not a published package.
    public_member_api_docs: false
    # Riverpod's family provider types (e.g. `ProviderFamily`) are not part of
    # its public API, so provider declarations cannot spell out their type.
    specify_nonobvious_property_types: false
