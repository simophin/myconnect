name: myconnect_ui
description: "Desktop UI for MyConnect"
publish_to: none

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  dio: ^5.11.1
  ffi: ^2.2.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  json_annotation: ^4.12.0
  logging: ^1.3.0
  material_ui: ^1.4.0
  tray_manager: ^0.7.0
  url_launcher: ^6.3.2
  window_manager: ^0.5.2

dev_dependencies:
  build_runner: ^2.16.1
  file_selector_platform_interface: ^2.7.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.2
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray_icon.png
    - assets/tray_icon_template.png
