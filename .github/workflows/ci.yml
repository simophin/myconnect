# Checks every change: the "Done means" list in docs/HANDOFF.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The workspace, which includes the native UI (gui/ turns on the "gui"
  # feature), and the CLI on its own, which must build without iced.
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    env:
      # No GPU on the runner: the UI's tests render in software.
      ICED_BACKEND: tiny-skia
    steps:
      - uses: actions/checkout@v7
      - name: Install the native UI's Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libvulkan1 \
            mesa-vulkan-drivers libdbus-1-dev libxcb1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - name: The CLI builds without the UI
        run: |
          cargo build -p myconnect --locked
          count=$(cargo tree -p myconnect -e normal --locked --prefix none | grep -c '^iced' || true)
          if [ "$count" != 0 ]; then
            echo "iced is in the CLI's dependency tree"
            exit 1
          fi

  # The app and the CLI on the other desktops, whose platform-specific code
  # the Rust job never compiles. Their tests aren't run: the end-to-end ones
  # need Linux's loopback discovery.
  desktop:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy -p myconnect-gui -p myconnect --all-targets --locked -- -D warnings
