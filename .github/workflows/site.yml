# Publishes the website (site/) to GitHub Pages, with its download links
# filled in from the latest release (site/build.py). It runs when a change to
# site/ lands on main and after the Build workflow has attached a release's
# packages, so the links never point at files that aren't uploaded yet.
# Needs Settings → Pages → Source: GitHub Actions.
name: Website

on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/site.yml]
  workflow_run:
    workflows: [Build]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    # After Build, only when it ran for a release and succeeded.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'release' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view --repo "$GITHUB_REPOSITORY" --json tagName,url,assets > release.json
          site/build.py release.json _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
