# Publishes the website (site/) to GitHub Pages, with its download links
# filled in from a release (site/build.py). It runs only from the Build
# workflow, with the release's tag once the packages are attached, so the
# links never point at files that aren't uploaded yet. A change to site/
# goes live with the next release.
# Needs Settings → Pages → Source: GitHub Actions.
name: Website

on:
  workflow_call:
    inputs:
      tag:
        description: "Release to link to"
        type: string
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-24.04
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,url,assets > release.json
          site/build.py release.json _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
