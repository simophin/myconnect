# Publishes the website (site/) to GitHub Pages, with its download links
# filled in from a release (site/build.py). The Build workflow calls it with
# the release's tag once it has attached the packages, so the links never
# point at files that aren't uploaded yet. It also runs when a change to site/
# lands on main, and by hand, both using the latest release.
# Needs Settings → Pages → Source: GitHub Actions.
name: Website

on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/site.yml]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: "Release to link to (default: the latest)"
        type: string
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-24.04
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          # With no tag, gh reads the latest release.
          gh release view $TAG --repo "$GITHUB_REPOSITORY" --json tagName,url,assets > release.json
          site/build.py release.json _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
