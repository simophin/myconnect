# Builds the macOS app (a universal .app in a DMG) when a release is
# published, and attaches it to the release. It can also be run by hand
# (Actions → Build → Run workflow), leaving the packages as run artifacts.
name: Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version shown to users, e.g. v1.2.3 (default: dev)"
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FLUTTER_VERSION: 3.47.1

jobs:
  # The app's version comes from the release tag (or the manual run's input)
  # as MAJOR.MINOR.PATCH, with an optional leading "v"; the build number is
  # this workflow's run number. Without one, the app says "dev".
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      name: ${{ steps.version.outputs.name }}
      flutter-args: ${{ steps.version.outputs.flutter-args }}
    steps:
      - id: version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.version }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          args="--build-number=$RUN_NUMBER"
          if [ -n "$TAG" ]; then
            version="${TAG#v}"
            # macOS only accepts numeric versions.
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Version '$TAG' isn't MAJOR.MINOR.PATCH (optionally prefixed with v)"
              exit 1
            fi
            echo "name=$version" >> "$GITHUB_OUTPUT"
            # --build-name sets the Info.plist version; the define is what
            # Settings shows (the Dart side reads it on every platform).
            args="$args --build-name=$version --dart-define=MYCONNECT_VERSION=$version"
          else
            echo "name=dev-${SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          echo "flutter-args=$args" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS (universal)
    needs: version
    runs-on: macos-15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build macos --release ${{ needs.version.outputs.flutter-args }}
      - name: Check the bundled core
        run: |
          app=build/macos/Build/Products/Release/myconnect_ui.app
          dylib="$app/Contents/Frameworks/libmyconnect_ffi.dylib"
          lipo "$dylib" -verify_arch arm64 x86_64
          otool -D "$dylib"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --entitlements - "$app"
          plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist"
          plutil -extract CFBundleVersion raw "$app/Contents/Info.plist"
      # Unsigned for now (ad-hoc signature only): Gatekeeper blocks it until
      # the user allows it in System Settings → Privacy & Security.
      - name: Package
        env:
          PACKAGE: myconnect-${{ needs.version.outputs.name }}-macos-universal.dmg
        run: |
          mkdir -p ../dist staging
          cp -R build/macos/Build/Products/Release/myconnect_ui.app staging/MyConnect.app
          ln -s /Applications staging/Applications
          hdiutil create -volname MyConnect -srcfolder staging -format UDZO \
            "../dist/$PACKAGE"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  release:
    name: Attach to release
    if: github.event_name == 'release'
    needs: macos
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
