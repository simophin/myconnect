# Builds the desktop app when a release is published and attaches the
# packages to the release: a universal macOS .app in a DMG, a Windows
# installer, Debian packages for amd64 and arm64 (the app and the CLI), and a
# PKGBUILD that repackages those for Arch Linux. It can also be run by hand
# (Actions → Build → Run workflow), leaving the packages as run artifacts.
# After a release it also publishes the website for it (site.yml).
# The scripts it runs are in packaging/.
name: Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version shown to users, e.g. v1.2.3 (default: dev)"
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The app's version comes from the release tag (or the manual run's input)
  # as MAJOR.MINOR.PATCH, with an optional leading "v"; the build number is
  # this workflow's run number. Without one, the app says "dev".
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      # In file names.
      name: ${{ steps.version.outputs.name }}
      # What Settings and About show, with a "v" in front (FERRY_VERSION;
      # empty: git describe).
      app: ${{ steps.version.outputs.app }}
      # Numeric, for macOS's Info.plist and Windows's file version.
      numeric: ${{ steps.version.outputs.numeric }}
      deb: ${{ steps.version.outputs.deb }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - id: version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.version }}
          SHA: ${{ github.sha }}
        run: |
          if [ -n "$TAG" ]; then
            version="${TAG#v}"
            # macOS and Windows only accept numeric versions.
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Version '$TAG' isn't MAJOR.MINOR.PATCH (optionally prefixed with v)"
              exit 1
            fi
            echo "name=$version" >> "$GITHUB_OUTPUT"
            echo "app=$version" >> "$GITHUB_OUTPUT"
            echo "numeric=$version" >> "$GITHUB_OUTPUT"
            echo "deb=$version" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "name=dev-${SHA::7}" >> "$GITHUB_OUTPUT"
            echo "numeric=0.0.0" >> "$GITHUB_OUTPUT"
            # Sorts before any release.
            echo "deb=0.0.0~dev+${SHA::7}" >> "$GITHUB_OUTPUT"
          fi

  macos:
    name: macOS (universal)
    needs: version
    runs-on: macos-15
    env:
      FERRY_VERSION: ${{ needs.version.outputs.app }}
      # Keep in step with packaging/macos/build_app.sh.
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v7
        with:
          # git describe, for a dev build's version.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: |
          cargo build --release --locked -p ferry-gui --target aarch64-apple-darwin
          cargo build --release --locked -p ferry-gui --target x86_64-apple-darwin
      - name: Package
        run: |
          packaging/macos/build_app.sh \
            "${{ needs.version.outputs.numeric }}" "${{ github.run_number }}" \
            "dist/ferry-${{ needs.version.outputs.name }}-macos-universal.dmg" \
            target/aarch64-apple-darwin/release/ferry-gui \
            target/x86_64-apple-darwin/release/ferry-gui
      - name: Check the bundle
        run: |
          app=dist/Ferry.app
          lipo "$app/Contents/MacOS/Ferry" -verify_arch arm64 x86_64
          codesign --verify --deep --strict --verbose=2 "$app"
          plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist"
          plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist"
          plutil -extract CFBundleVersion raw "$app/Contents/Info.plist"
          "$app/Contents/MacOS/Ferry" --version
          rm -rf "$app"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows (x64)
    needs: version
    runs-on: windows-2025
    env:
      FERRY_VERSION: ${{ needs.version.outputs.app }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Two builds, as on Linux.
      - run: |
          cargo build --release --locked -p ferry-gui
          cargo build --release --locked -p ferry
      # The runner image doesn't have NSIS any more.
      - name: Install NSIS
        run: |
          choco install nsis --no-progress -y
          echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"
      - name: Package
        run: |
          mkdir dist
          # makensis wants Windows paths.
          root=$(cygpath -w "$PWD")
          makensis -V3 \
            "-DVERSION=${{ needs.version.outputs.name }}" \
            "-DFILE_VERSION=${{ needs.version.outputs.numeric }}.${{ github.run_number }}" \
            "-DAPP=$root\\target\\release\\ferry-gui.exe" \
            "-DCLI=$root\\target\\release\\ferry.exe" \
            "-DOUT=$root\\dist\\ferry-${{ needs.version.outputs.name }}-windows-x64-setup.exe" \
            packaging/windows/installer.nsi
      - name: Check the installer
        run: |
          ./dist/*-setup.exe //S
          dir="$LOCALAPPDATA/Programs/Ferry"
          ls -R "$dir"
          "$dir/cli/ferry.exe" --version
          reg query 'HKCU\Software\Classes\AppUserModelId\dev.fanchao.Ferry'
          # _?= runs the uninstaller in place, so this waits for it; it
          # wants a Windows path.
          "$dir/uninstall.exe" //S "_?=$(cygpath -w "$dir")"
          test ! -e "$dir/Ferry.exe"
          if reg query 'HKCU\Software\Classes\AppUserModelId\dev.fanchao.Ferry'; then
            echo "the uninstaller left the notification id registered"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux (${{ matrix.arch }})
    needs: version
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # The packages need the glibc they were built against, so build on an old
    # system. The result installs on Debian 12+ and Ubuntu 22.04+.
    container: debian:12
    env:
      FERRY_VERSION: ${{ needs.version.outputs.app }}
    steps:
      - name: Install Linux build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git gcc libc6-dev pkg-config libxcb1-dev dpkg-dev
          # The checkout belongs to another user than the job's root, so git
          # (git describe, in gui/build.rs) refuses it as "dubious ownership".
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Two builds: one with both packages would turn the gui feature on for
      # the CLI too, and put iced in it.
      - run: |
          cargo build --release --locked -p ferry-gui
          cargo build --release --locked -p ferry
      - name: Package
        run: |
          packaging/linux/build_deb.sh \
            target/release/ferry-gui target/release/ferry \
            "${{ needs.version.outputs.deb }}" dist
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # Installs the .deb on a clean Debian 12 and starts the app under Xvfb: it
  # must come up, open its window and serve the API the CLI talks to.
  linux-check:
    name: Linux (${{ matrix.arch }}) installs and starts
    needs: linux
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: linux-${{ matrix.arch }}
          path: dist
      - run: packaging/linux/check_deb.sh dist/*.deb

  arch:
    name: Arch Linux PKGBUILD
    # The PKGBUILD downloads the .debs from the release, so it needs a tag.
    if: needs.version.outputs.tag != ''
    needs: [version, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: linux-*
          path: debs
          merge-multiple: true
      - env:
          TAG: ${{ needs.version.outputs.tag }}
          DEB: ${{ needs.version.outputs.deb }}
        run: |
          mkdir dist
          packaging/linux/pkgbuild.sh "$TAG" \
            "debs/ferry_${DEB}_amd64.deb" "debs/ferry_${DEB}_arm64.deb" \
            > dist/PKGBUILD
          cat dist/PKGBUILD
      - uses: actions/upload-artifact@v7
        with:
          name: arch
          path: dist/*
          if-no-files-found: error

  release:
    name: Attach to release
    if: github.event_name == 'release'
    needs: [macos, windows, linux, linux-check, arch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  # Points the website's downloads at this release, now that its packages
  # are attached. A pre-release keeps the site on the last full release.
  website:
    name: Website
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/site.yml
    with:
      tag: ${{ github.event.release.tag_name }}
