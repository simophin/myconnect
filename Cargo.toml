[workspace]
members = [".", "ffi", "gui"]

[package]
name = "myconnect"
version = "0.1.0"
edition = "2024"
default-run = "myconnect"

[features]
# The desktop UI: `src/ui/` and each plugin's `ui.rs`. Off by default so the
# CLI and daemon build without iced; the `gui` crate turns it on.
gui = ["dep:iced", "dep:iced_fonts"]

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", features = ["multipart"] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
directories = "6"
futures-core = "0.3"
futures-util = "0.3"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
socket2 = { version = "0.6", features = ["all"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
x509-parser = { version = "0.18", default-features = false }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring"] }
gethostname = "1"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
# `ring` rather than the default aws-lc-rs: rustls already uses ring, and
# aws-lc-rs needs cmake and NASM to build on Windows.
russh = { version = "0.63", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3"
# The desktop UI (`gui` feature). Upgrading iced is its own change.
iced = { version = "0.14", features = ["advanced"], optional = true }
iced_fonts = { version = "0.3", features = ["lucide"], optional = true }

[dev-dependencies]
iced_runtime = "0.14"
iced_test = "0.14"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
