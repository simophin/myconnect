[workspace]
members = [".", "gui"]

[package]
name = "ferry"
version = "0.1.0"
edition = "2024"
default-run = "ferry"

[features]
# The desktop UI: `src/ui/`. Off by default so the
# CLI and daemon build without iced; the `gui` crate turns it on.
gui = [
    "dep:chrono",
    "dep:display-info",
    "dep:iced",
    "dep:iced_fonts",
    "dep:image",
    "dep:interprocess",
    "dep:ksni",
    "dep:libc",
    "dep:mac-usernotifications",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:opener",
    "dep:rfd",
    "dep:tray-icon",
    "dep:windows-registry",
    "dep:zbus",
]

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", features = ["multipart"] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
directories = "6"
futures-core = "0.3"
futures-util = "0.3"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
socket2 = { version = "0.6", features = ["all"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
x509-parser = { version = "0.18", default-features = false }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring"] }
gethostname = "1"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
# `ring` rather than the default aws-lc-rs: rustls already uses ring, and
# aws-lc-rs needs cmake and NASM to build on Windows.
russh = { version = "0.63", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3"
# The desktop UI (`gui` feature). Upgrading iced is its own change.
iced = { version = "0.14", features = ["advanced", "image-without-codecs"], optional = true }
iced_fonts = { version = "0.3", features = ["lucide"], optional = true }
opener = { version = "0.8", features = ["reveal"], optional = true }
rfd = { version = "0.17", optional = true }
# Decodes previews, so one that can't be shown says so. iced renders
# images through the same crate; only the codecs the preview offers are on.
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"], optional = true }
# Local time for file dates; already in the tree through russh-sftp.
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
# Every monitor's bounds, for the saved window placement's fits-on-screen
# check; iced knows only the current monitor's size.
display-info = { version = "0.5", optional = true }
# The single-instance socket, named from the data dir.
interprocess = { version = "2.4", optional = true }

[target.'cfg(unix)'.dependencies]
# The uid in the single-instance socket's name (`gui`).
libc = { version = "0.2", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# The tray (`gui`), over D-Bus. Both on async-io, as iced's theme detection
# already has zbus: its `tokio` feature would need a runtime on iced's
# threads.
ksni = { version = "0.3", default-features = false, features = ["async-io"], optional = true }
zbus = { version = "5", default-features = false, features = ["async-io"], optional = true }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
# The tray (`gui`), with `muda` menus (re-exported as `tray_icon::menu`).
tray-icon = { version = "0.25", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Notifications (`gui`), through `UNUserNotificationCenter`: the crate
# `notify-rust` builds its macOS backend on, used directly for its async
# API, so a click and a withdrawal need no thread per notification.
mac-usernotifications = { version = "0.3.1", optional = true }
# The Dock icon (`gui`), shown only while the window is open. Already in
# the tree through `tray-icon`.
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication"], optional = true }

[target.'cfg(windows)'.dependencies]
# Starting on login (`gui`): a value under `HKCU\...\Run`. From windows-rs;
# its `windows-*` dependencies are already in the tree.
windows-registry = { version = "0.6", optional = true }

[[test]]
name = "ui_e2e"
required-features = ["gui"]

[dev-dependencies]
iced_runtime = "0.14"
iced_test = "0.14"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
