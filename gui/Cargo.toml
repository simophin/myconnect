[package]
name = "myconnect-gui"
version = "0.1.0"
edition = "2024"
description = "Spike: a native Rust (iced) desktop UI for MyConnect"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
iced = "0.14"
iced_fonts = { version = "0.3", features = ["lucide"] }
myconnect = { path = ".." }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
iced_test = "0.14"
