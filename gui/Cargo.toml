[package]
name = "myconnect-gui"
version = "0.1.0"
edition = "2024"
description = "The MyConnect desktop app: the daemon and its iced UI in one process"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
myconnect = { path = "..", features = ["gui"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.build-dependencies]
# The exe's icon and the name Task Manager shows.
winresource = "0.1"
