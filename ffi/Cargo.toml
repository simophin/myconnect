[package]
name = "myconnect-ffi"
version = "0.1.0"
edition = "2024"
description = "C ABI for embedding a MyConnect daemon in a GUI process (used by the Flutter UI)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
myconnect = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
